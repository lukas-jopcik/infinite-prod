version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd infinite-v2
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: infinite-v2/.next
    files:
      - '**/*'
  cache:
    paths:
      - infinite-v2/node_modules/**/*
      - infinite-v2/.next/cache/**/*