name: Monitoring

on:
  schedule:
    - cron: '*/5 * * * *'  # Run every 5 minutes
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to monitor'
        required: true
        default: 'prod'
        type: choice
        options:
        - dev
        - staging
        - prod

env:
  NODE_VERSION: '18'
  AWS_REGION: 'eu-central-1'

jobs:
  # Health monitoring
  health-monitor:
    name: Health Monitor
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Run health check
      run: |
        chmod +x scripts/smoke-tests/*.sh
        ./scripts/smoke-tests/health-check.sh -e ${{ inputs.environment || 'prod' }}
      id: health-check

    - name: Alert on health check failure
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        channel: '#alerts'
        text: |
          🚨 HEALTH CHECK FAILED
          Environment: ${{ inputs.environment || 'prod' }}
          Time: $(date)
          Check the logs for details
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Performance monitoring
  performance-monitor:
    name: Performance Monitor
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm ci
        cd infinite-v2 && npm ci

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Run performance tests
      run: |
        npm run test:performance
      env:
        NODE_ENV: test
        AWS_REGION: ${{ env.AWS_REGION }}

    - name: Check performance thresholds
      run: |
        # Check if performance tests passed
        if [ $? -eq 0 ]; then
          echo "Performance tests passed"
        else
          echo "Performance tests failed"
          exit 1
        fi

    - name: Alert on performance issues
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        channel: '#alerts'
        text: |
          ⚠️ PERFORMANCE ISSUES DETECTED
          Environment: ${{ inputs.environment || 'prod' }}
          Time: $(date)
          Check the performance test logs for details
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Lambda monitoring
  lambda-monitor:
    name: Lambda Monitor
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Check Lambda function health
      run: |
        environment="${{ inputs.environment || 'prod' }}"
        
        # Check each Lambda function
        functions=(
          "infinite-nasa-apod-$environment-fetcher"
          "infinite-nasa-apod-$environment-content-processor"
          "infinite-nasa-apod-$environment-api-latest"
          "infinite-nasa-apod-$environment-api-reprocess"
          "infinite-nasa-apod-$environment-ai-content-generator"
        )
        
        failed_functions=()
        
        for func in "${functions[@]}"; do
          echo "Checking $func..."
          
          # Check if function exists and is active
          if ! aws lambda get-function --function-name "$func" &> /dev/null; then
            failed_functions+=("$func (not found)")
            continue
          fi
          
          # Check function state
          state=$(aws lambda get-function --function-name "$func" --query 'Configuration.State' --output text)
          if [ "$state" != "Active" ]; then
            failed_functions+=("$func (state: $state)")
            continue
          fi
          
          # Check recent errors
          error_count=$(aws logs filter-log-events \
            --log-group-name "/aws/lambda/$func" \
            --start-time $(date -d '5 minutes ago' +%s)000 \
            --filter-pattern "ERROR" \
            --query 'events | length(@)' \
            --output text 2>/dev/null || echo "0")
          
          if [ "$error_count" -gt 5 ]; then
            failed_functions+=("$func (high error count: $error_count)")
          fi
        done
        
        if [ ${#failed_functions[@]} -gt 0 ]; then
          echo "Failed functions:"
          printf '%s\n' "${failed_functions[@]}"
          exit 1
        else
          echo "All Lambda functions are healthy"
        fi

    - name: Alert on Lambda issues
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        channel: '#alerts'
        text: |
          🚨 LAMBDA FUNCTION ISSUES
          Environment: ${{ inputs.environment || 'prod' }}
          Time: $(date)
          Check the Lambda monitoring logs for details
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Database monitoring
  database-monitor:
    name: Database Monitor
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Check DynamoDB health
      run: |
        environment="${{ inputs.environment || 'prod' }}"
        
        # Check each DynamoDB table
        tables=(
          "InfiniteRawContent-$environment"
          "InfiniteArticles-$environment"
        )
        
        failed_tables=()
        
        for table in "${tables[@]}"; do
          echo "Checking $table..."
          
          # Check if table exists and is active
          if ! aws dynamodb describe-table --table-name "$table" &> /dev/null; then
            failed_tables+=("$table (not found)")
            continue
          fi
          
          # Check table status
          status=$(aws dynamodb describe-table --table-name "$table" --query 'Table.TableStatus' --output text)
          if [ "$status" != "ACTIVE" ]; then
            failed_tables+=("$table (status: $status)")
            continue
          fi
          
          # Check table size
          item_count=$(aws dynamodb describe-table --table-name "$table" --query 'Table.ItemCount' --output text)
          if [ "$item_count" -eq 0 ]; then
            failed_tables+=("$table (no data)")
          fi
        done
        
        if [ ${#failed_tables[@]} -gt 0 ]; then
          echo "Failed tables:"
          printf '%s\n' "${failed_tables[@]}"
          exit 1
        else
          echo "All DynamoDB tables are healthy"
        fi

    - name: Alert on database issues
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        channel: '#alerts'
        text: |
          🚨 DATABASE ISSUES
          Environment: ${{ inputs.environment || 'prod' }}
          Time: $(date)
          Check the database monitoring logs for details
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # API monitoring
  api-monitor:
    name: API Monitor
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check API endpoints
      run: |
        environment="${{ inputs.environment || 'prod' }}"
        
        # Set API base URL based on environment
        case "$environment" in
          "dev")
            api_base_url="https://dev-api.example.com"
            ;;
          "staging")
            api_base_url="https://staging-api.example.com"
            ;;
          "prod")
            api_base_url="https://api.example.com"
            ;;
        esac
        
        # Test each API endpoint
        endpoints=(
          "/api/latest"
          "/api/articles"
          "/api/reprocess"
        )
        
        failed_endpoints=()
        
        for endpoint in "${endpoints[@]}"; do
          echo "Testing $endpoint..."
          
          # Test endpoint with timeout
          if ! timeout 10s curl -s -f "$api_base_url$endpoint" &> /dev/null; then
            failed_endpoints+=("$endpoint")
          fi
        done
        
        if [ ${#failed_endpoints[@]} -gt 0 ]; then
          echo "Failed endpoints:"
          printf '%s\n' "${failed_endpoints[@]}"
          exit 1
        else
          echo "All API endpoints are healthy"
        fi

    - name: Alert on API issues
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        channel: '#alerts'
        text: |
          🚨 API ENDPOINT ISSUES
          Environment: ${{ inputs.environment || 'prod' }}
          Time: $(date)
          Check the API monitoring logs for details
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Frontend monitoring
  frontend-monitor:
    name: Frontend Monitor
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check frontend health
      run: |
        environment="${{ inputs.environment || 'prod' }}"
        
        # Set frontend URL based on environment
        case "$environment" in
          "dev")
            frontend_url="https://dev.example.com"
            ;;
          "staging")
            frontend_url="https://staging.example.com"
            ;;
          "prod")
            frontend_url="https://example.com"
            ;;
        esac
        
        echo "Testing frontend at $frontend_url..."
        
        # Test frontend with timeout
        if ! timeout 15s curl -s -f "$frontend_url" &> /dev/null; then
          echo "Frontend is not accessible"
          exit 1
        else
          echo "Frontend is healthy"
        fi

    - name: Alert on frontend issues
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        channel: '#alerts'
        text: |
          🚨 FRONTEND ISSUES
          Environment: ${{ inputs.environment || 'prod' }}
          Time: $(date)
          Check the frontend monitoring logs for details
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Generate monitoring report
  monitoring-report:
    name: Monitoring Report
    runs-on: ubuntu-latest
    needs: [health-monitor, performance-monitor, lambda-monitor, database-monitor, api-monitor, frontend-monitor]
    if: always()
    
    steps:
    - name: Generate monitoring report
      run: |
        echo "# Monitoring Report" > monitoring-report.md
        echo "" >> monitoring-report.md
        echo "**Date:** $(date)" >> monitoring-report.md
        echo "**Environment:** ${{ inputs.environment || 'prod' }}" >> monitoring-report.md
        echo "" >> monitoring-report.md
        echo "## Monitoring Results" >> monitoring-report.md
        echo "" >> monitoring-report.md
        
        # Health monitor
        if [ "${{ needs.health-monitor.result }}" == "success" ]; then
          echo "- ✅ **Health Monitor**: PASSED" >> monitoring-report.md
        else
          echo "- ❌ **Health Monitor**: FAILED" >> monitoring-report.md
        fi
        
        # Performance monitor
        if [ "${{ needs.performance-monitor.result }}" == "success" ]; then
          echo "- ✅ **Performance Monitor**: PASSED" >> monitoring-report.md
        else
          echo "- ❌ **Performance Monitor**: FAILED" >> monitoring-report.md
        fi
        
        # Lambda monitor
        if [ "${{ needs.lambda-monitor.result }}" == "success" ]; then
          echo "- ✅ **Lambda Monitor**: PASSED" >> monitoring-report.md
        else
          echo "- ❌ **Lambda Monitor**: FAILED" >> monitoring-report.md
        fi
        
        # Database monitor
        if [ "${{ needs.database-monitor.result }}" == "success" ]; then
          echo "- ✅ **Database Monitor**: PASSED" >> monitoring-report.md
        else
          echo "- ❌ **Database Monitor**: FAILED" >> monitoring-report.md
        fi
        
        # API monitor
        if [ "${{ needs.api-monitor.result }}" == "success" ]; then
          echo "- ✅ **API Monitor**: PASSED" >> monitoring-report.md
        else
          echo "- ❌ **API Monitor**: FAILED" >> monitoring-report.md
        fi
        
        # Frontend monitor
        if [ "${{ needs.frontend-monitor.result }}" == "success" ]; then
          echo "- ✅ **Frontend Monitor**: PASSED" >> monitoring-report.md
        else
          echo "- ❌ **Frontend Monitor**: FAILED" >> monitoring-report.md
        fi
        
        echo "" >> monitoring-report.md
        echo "## Summary" >> monitoring-report.md
        echo "" >> monitoring-report.md
        
        # Count failures
        failures=0
        if [ "${{ needs.health-monitor.result }}" != "success" ]; then ((failures++)); fi
        if [ "${{ needs.performance-monitor.result }}" != "success" ]; then ((failures++)); fi
        if [ "${{ needs.lambda-monitor.result }}" != "success" ]; then ((failures++)); fi
        if [ "${{ needs.database-monitor.result }}" != "success" ]; then ((failures++)); fi
        if [ "${{ needs.api-monitor.result }}" != "success" ]; then ((failures++)); fi
        if [ "${{ needs.frontend-monitor.result }}" != "success" ]; then ((failures++)); fi
        
        if [ $failures -eq 0 ]; then
          echo "🎉 All monitoring checks passed! System is healthy." >> monitoring-report.md
        else
          echo "⚠️ $failures monitoring check(s) failed. Please investigate." >> monitoring-report.md
        fi

    - name: Upload monitoring report
      uses: actions/upload-artifact@v4
      with:
        name: monitoring-report-${{ inputs.environment || 'prod' }}-$(date +%Y%m%d-%H%M%S)
        path: monitoring-report.md
        retention-days: 30

    - name: Send monitoring summary
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#monitoring'
        text: |
          📊 MONITORING SUMMARY
          Environment: ${{ inputs.environment || 'prod' }}
          Time: $(date)
          
          Health Monitor: ${{ needs.health-monitor.result }}
          Performance Monitor: ${{ needs.performance-monitor.result }}
          Lambda Monitor: ${{ needs.lambda-monitor.result }}
          Database Monitor: ${{ needs.database-monitor.result }}
          API Monitor: ${{ needs.api-monitor.result }}
          Frontend Monitor: ${{ needs.frontend-monitor.result }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
