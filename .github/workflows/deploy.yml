name: Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - staging
        - prod
      skip_tests:
        description: 'Skip tests before deployment'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '18'
  AWS_REGION: 'eu-central-1'

jobs:
  # Pre-deployment validation
  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm ci
        cd infinite-v2 && npm ci

    - name: Run quick validation tests
      run: |
        npm run test:unit:lambda
        npm run test:unit:frontend
      env:
        NODE_ENV: test
        AWS_REGION: ${{ env.AWS_REGION }}

  # Build and package
  build:
    name: Build and Package
    runs-on: ubuntu-latest
    needs: validate
    if: always() && (needs.validate.result == 'success' || inputs.skip_tests)
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm ci
        cd infinite-v2 && npm ci

    - name: Build frontend
      run: |
        cd infinite-v2
        npm run build
      env:
        NODE_ENV: production

    - name: Package Lambda functions
      run: |
        mkdir -p dist/lambda
        for func in aws/lambda/*/; do
          if [ -f "$func/package.json" ]; then
            func_name=$(basename "$func")
            echo "Packaging $func_name..."
            cd "$func"
            npm ci --production
            zip -r "../../dist/lambda/$func_name.zip" . -x "*.git*" "*.test.*" "*.spec.*"
            cd - > /dev/null
          fi
        done

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-${{ inputs.environment }}
        path: |
          dist/
          infinite-v2/.next/
        retention-days: 7

  # Deploy Lambda functions
  deploy-lambda:
    name: Deploy Lambda Functions
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ inputs.environment }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts-${{ inputs.environment }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Deploy Lambda functions
      run: |
        for zip_file in dist/lambda/*.zip; do
          if [ -f "$zip_file" ]; then
            func_name=$(basename "$zip_file" .zip)
            echo "Deploying $func_name to ${{ inputs.environment }}..."
            aws lambda update-function-code \
              --function-name "infinite-nasa-apod-${{ inputs.environment }}-$func_name" \
              --zip-file "fileb://$zip_file"
            
            # Update function configuration if needed
            aws lambda update-function-configuration \
              --function-name "infinite-nasa-apod-${{ inputs.environment }}-$func_name" \
              --environment Variables='{
                "REGION":"'${{ env.AWS_REGION }}'",
                "ENVIRONMENT":"'${{ inputs.environment }}'",
                "DYNAMODB_RAW_CONTENT_TABLE":"InfiniteRawContent-'${{ inputs.environment }}'",
                "DYNAMODB_ARTICLES_TABLE":"InfiniteArticles-'${{ inputs.environment }}'",
                "NASA_SECRET_ARN":"arn:aws:secretsmanager:'${{ env.AWS_REGION }}':349660737637:secret:infinite/nasa-api-key-'${{ inputs.environment }}'",
                "OPENAI_API_KEY_SECRET_ARN":"arn:aws:secretsmanager:'${{ env.AWS_REGION }}':349660737637:secret:infinite/openai-api-key-'${{ inputs.environment }}'",
                "S3_BUCKET_NAME":"infinite-nasa-apod-'${{ inputs.environment }}'-images-349660737637",
                "CLOUDFRONT_DOMAIN":"d2ydyf9w4v170.cloudfront.net",
                "CLOUDFRONT_DISTRIBUTION_ID":"E1234567890ABC"
              }'
          fi
        done

    - name: Verify Lambda deployment
      run: |
        for zip_file in dist/lambda/*.zip; do
          if [ -f "$zip_file" ]; then
            func_name=$(basename "$zip_file" .zip)
            echo "Verifying $func_name deployment..."
            aws lambda get-function --function-name "infinite-nasa-apod-${{ inputs.environment }}-$func_name"
          fi
        done

  # Deploy frontend
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ inputs.environment }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts-${{ inputs.environment }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: |
        cd infinite-v2 && npm ci

    - name: Deploy to Amplify
      run: |
        cd infinite-v2
        case "${{ inputs.environment }}" in
          "dev")
            npm run deploy:dev
            ;;
          "staging")
            npm run deploy:staging
            ;;
          "prod")
            npm run deploy:prod
            ;;
        esac
      env:
        NODE_ENV: production

  # Post-deployment verification
  verify-deployment:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-lambda, deploy-frontend]
    environment: ${{ inputs.environment }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Run deployment verification
      run: |
        chmod +x scripts/smoke-tests/*.sh
        ./scripts/smoke-tests/deployment-verification.sh -e ${{ inputs.environment }} -d ${{ github.sha }}

    - name: Run smoke tests
      run: |
        ./scripts/smoke-tests/production-smoke-test.sh -e ${{ inputs.environment }}

    - name: Run health check
      run: |
        ./scripts/smoke-tests/health-check.sh -e ${{ inputs.environment }}

  # Rollback on failure
  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [deploy-lambda, deploy-frontend, verify-deployment]
    if: failure() && (needs.deploy-lambda.result == 'failure' || needs.deploy-frontend.result == 'failure' || needs.verify-deployment.result == 'failure')
    environment: ${{ inputs.environment }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Rollback Lambda functions
      run: |
        echo "Rolling back Lambda functions..."
        # Get previous version and rollback
        for func in aws/lambda/*/; do
          if [ -f "$func/package.json" ]; then
            func_name=$(basename "$func")
            echo "Rolling back $func_name..."
            # Get previous version
            previous_version=$(aws lambda list-versions-by-function \
              --function-name "infinite-nasa-apod-${{ inputs.environment }}-$func_name" \
              --query 'Versions[-2].Version' \
              --output text)
            
            if [ "$previous_version" != "null" ] && [ "$previous_version" != "$LATEST" ]; then
              aws lambda update-alias \
                --function-name "infinite-nasa-apod-${{ inputs.environment }}-$func_name" \
                --name "LIVE" \
                --function-version "$previous_version"
            fi
          fi
        done

    - name: Notify rollback
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        channel: '#deployments'
        text: |
          🚨 DEPLOYMENT ROLLBACK
          Environment: ${{ inputs.environment }}
          Commit: ${{ github.sha }}
          Author: ${{ github.actor }}
          Reason: Deployment verification failed
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Success notification
  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [deploy-lambda, deploy-frontend, verify-deployment]
    if: success()
    
    steps:
    - name: Notify Slack
      uses: 8398a7/action-slack@v3
      with:
        status: success
        channel: '#deployments'
        text: |
          ✅ DEPLOYMENT SUCCESSFUL
          Environment: ${{ inputs.environment }}
          Commit: ${{ github.sha }}
          Author: ${{ github.actor }}
          Deployment ID: ${{ github.sha }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Create deployment record
      run: |
        echo "Creating deployment record..."
        # Create a deployment record in DynamoDB or other tracking system
        aws dynamodb put-item \
          --table-name "InfiniteDeployments-${{ inputs.environment }}" \
          --item '{
            "deploymentId": {"S": "'${{ github.sha }}'"},
            "environment": {"S": "'${{ inputs.environment }}'"},
            "timestamp": {"S": "'$(date -u +%Y-%m-%dT%H:%M:%S.000Z)'"},
            "author": {"S": "'${{ github.actor }}'"},
            "status": {"S": "success"},
            "commitMessage": {"S": "'${{ github.event.head_commit.message }}'"}
          }' || echo "Deployment record creation failed (table may not exist)"
